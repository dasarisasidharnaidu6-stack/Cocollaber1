version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: cocollaber-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cocollaber_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cocollaber_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cocollaber_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cocollaber_user} -d ${POSTGRES_DB:-cocollaber_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cocollaber-api
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cocollaber_user}:${POSTGRES_PASSWORD:-cocollaber_dev_password}@db:5432/${POSTGRES_DB:-cocollaber_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cocollaber-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Optional Redis profile
  redis:
    image: redis:7-alpine
    container_name: cocollaber-redis
    ports:
      - "6379:6379"
    profiles:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
