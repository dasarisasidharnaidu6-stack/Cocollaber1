name: CoCollaber Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality & Regression (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check apps/api

      - name: Run Pytest Regression Suite
        run: |
          python -m pytest apps/api/tests -v --durations=10
        env:
          PYTHONPATH: .

  frontend-quality:
    name: Frontend Typecheck, Lint & Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Generate Next.js TypeScript declarations
        working-directory: apps/web
        run: npm run typegen

      - name: Verify TypeScript types
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint Next.js codebase
        working-directory: apps/web
        run: npm run lint

      - name: Build production bundle
        working-directory: apps/web
        run: npm run build

  e2e-playwright:
    name: Playwright E2E Journeys
    needs: [frontend-quality, backend-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium Browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build Next.js application
        working-directory: apps/web
        run: npm run build

      - name: Run Playwright End-to-End Tests
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  dependency-security:
    name: Dependency & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit npm production dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high --omit=dev || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for secret leaks & syntax issues
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files || true
